<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ganti Kata Sandi - Inventaris Obat RS</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial,sans-serif; background: #f1f5f9; color: #1e293b; }
    main { width: min(100%, 460px); background: white; padding: 30px; border: 1px solid #e2e8f0; border-radius: 12px; }
    h1 { color: #075985; font-size: 23px; } p { color: #64748b; line-height: 1.5; font-size: 14px; }
    label { display: block; font-weight: bold; font-size: 14px; margin: 18px 0 7px; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    input:focus { outline: 3px solid #bae6fd; } button { width: 100%; margin-top: 22px; padding: 12px; background: #0284c7; color: white; border: 0; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; } a { color: #0369a1; } .message { padding: 12px; background: #fef2f2; color: #991b1b; border-radius: 6px; } .success { background: #dcfce7; color: #166534; } [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <a href="/dashboard">&larr; Kembali ke dashboard</a>
    <h1>Ganti Kata Sandi</h1>
    <p>Gunakan minimal 8 karakter dengan kombinasi huruf dan angka. Setelah disimpan, Anda perlu login kembali.</p>
    <div id="message" class="message" role="alert" hidden></div>
    <form id="passwordForm">
      <label for="oldPassword">Kata sandi lama</label><input id="oldPassword" type="password" required autocomplete="current-password">
      <label for="newPassword">Kata sandi baru</label><input id="newPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
      <label for="confirmation">Konfirmasi kata sandi baru</label><input id="confirmation" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
      <button id="save" type="submit">Simpan Kata Sandi</button>
    </form>
    <p id="loginLink" hidden><a href="/login">Login dengan kata sandi baru &rarr;</a></p>
  </main>
  <script>
    const form = document.getElementById('passwordForm'), message = document.getElementById('message'), save = document.getElementById('save');
    form.addEventListener('submit', async event => {
      event.preventDefault(); message.hidden = true; save.disabled = true;
      const newPassword = document.getElementById('newPassword').value;
      try {
        if (newPassword !== document.getElementById('confirmation').value) throw new Error('Konfirmasi kata sandi tidak cocok.');
        if (!/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword) || new TextEncoder().encode(newPassword).length > 72) throw new Error('Gunakan kombinasi huruf dan angka, maksimal 72 byte.');
        const response = await fetch('/api/auth/password', { method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oldPassword: document.getElementById('oldPassword').value, newPassword }) });
        if (response.status === 401) { location.assign('/login'); return; }
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Gagal menyimpan kata sandi.');
        form.reset(); form.hidden = true; message.className = 'message success'; message.textContent = result.message; message.hidden = false;
        document.getElementById('loginLink').hidden = false;
      } catch (error) { message.textContent = error.message; message.hidden = false; }
      finally { save.disabled = false; }
    });
  </script>
</body>
</html>
