<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RS Inventaris – Data Obat</title>
<style>
  :root {
    --navy: #2f3e63;
    --navy-dark: #212f63;
    --blue: #4366b2;
    --green: #4aa35e;
    --ink: #1f2a4a;
    --muted: #7b869c;
    --line: #e3e7ee;
    --bg: #f3f5f9;
    --red: #d9473f;
    --orange: #e8833a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Segoe UI", Verdana, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: grid;
    grid-template-columns: 265px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
  }

  [hidden] {
    display: none !important;
  }

  .top {
    grid-column: 1 / -1;
    background: #1a365d;
    color: #fff;
    min-height: 80px;
    padding: 12px 28px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }

  .top h1 {
    font-size: 19px;
    text-align: center;
  }

  .account {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    flex-wrap: wrap;
  }

  #identity {
    font-size: 13px;
    color: #cbd5e0;
  }

  .top nav {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .top nav a {
    color: #fff;
    font-size: 13px;
  }

  .top button {
    border: 0;
    border-radius: 3px;
    padding: 10px 14px;
    background: #edf2f7;
    color: #2d3748;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  .side {
    background: #2c3e5a;
    padding: 20px 14px;
    overflow-y: auto;
  }

  .brand {
    color: #63b3ed;
    font-weight: 700;
    font-size: 17px;
    padding: 6px 14px 22px;
    letter-spacing: .3px;
  }

  .side a {
    display: block;
    color: #a9b4c6;
    text-decoration: none;
    font-size: 15px;
    padding: 18px 22px;
    border-radius: 4px;
  }

  .side a.on {
    background: #4a5a74;
    color: #fff;
  }

  main {
    padding: 26px 30px;
    min-width: 0;
    overflow-y: auto;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 20px;
  }

  h2 {
    font-size: 14px;
    margin-bottom: 12px;
  }

  .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    border: 0;
    border-radius: 4px;
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 14px;
    cursor: pointer;
    text-decoration: none;
  }

  .btn.blue {
    background: var(--blue);
  }

  .btn.ghost {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
  }

  .btn:hover {
    filter: brightness(.95);
  }

  .btn:disabled {
    opacity: .6;
    cursor: wait;
  }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .kpi {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 4px solid var(--blue);
    border-radius: 6px;
    padding: 14px;
    color: inherit;
    text-decoration: none;
    display: block;
  }

  .kpi.green {
    border-left-color: #3fb768;
  }

  .kpi.orange {
    border-left-color: var(--orange);
  }

  .kpi.red {
    border-left-color: var(--red);
  }

  .kpi span {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
  }

  .kpi strong {
    display: block;
    font-size: 22px;
    margin-top: 6px;
  }

  .grid2 {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 16px;
  }

  .chart {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    height: 210px;
  }

  .bar {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    height: 100%;
    font-size: 11px;
    gap: 4px;
  }

  .bar i {
    display: block;
    width: 100%;
    background: #4a90e2;
    border-radius: 3px 3px 0 0;
    min-height: 2px;
  }

  .bar small {
    color: var(--muted);
  }

  .tw {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }

  th {
    background: #eef1f6;
    text-align: left;
    font-size: 11.5px;
    padding: 10px;
    white-space: nowrap;
  }

  td {
    padding: 10px;
    border-bottom: 1px solid var(--line);
  }

  td.num, th.num {
    text-align: right;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge.green {
    background: #dcfce7;
    color: #15803d;
  }

  .badge.yellow {
    background: #fdf0cf;
    color: #8a5a00;
  }

  .badge.red {
    background: #fde2e0;
    color: #b3261e;
  }

  .badge.gray {
    background: #e8ebf1;
    color: #5b667d;
  }

  .tools {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  input, select {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: #f3f5f9;
    border: 1px solid var(--line);
    border-radius: 4px;
    height: 36px;
    padding: 0 10px;
    outline: none;
    min-width: 0;
  }

  input:focus, select:focus {
    border-color: var(--blue);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(67, 102, 178, .15);
  }

  .tools input {
    flex: 1;
    min-width: 200px;
  }

  label.lbl {
    display: block;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 5px;
  }

  .f {
    margin-bottom: 12px;
  }

  .f input, .f select {
    width: 100%;
  }

  .frow {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .alert {
    display: none;
    font-size: 12px;
    padding: 9px 12px;
    border-radius: 4px;
    margin-bottom: 12px;
    background: #fdecea;
    color: #b3261e;
  }

  .alert.show {
    display: block;
  }

  .alert.ok {
    background: #dcfce7;
    color: #15803d;
  }

  .pager {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }

  dialog {
    border: 0;
    border-radius: 8px;
    padding: 20px;
    width: min(440px, 92vw);
    margin: auto;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .3);
  }

  dialog::backdrop {
    background: rgba(31, 42, 74, .5);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 24px;
  }

  .lnk {
    background: var(--red);
    border: 0;
    border-radius: 4px;
    color: #fff;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 12px;
    white-space: nowrap;
    cursor: pointer;
  }

  .lnk:hover {
    filter: brightness(.92);
  }

  .lnk.on {
    background: var(--green);
  }

  @media(max-width: 900px) {
    body {
      height: auto;
      min-height: 100vh;
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }
    .top {
      grid-template-columns: 1fr;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .account {
      justify-content: center;
    }
    .side {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      padding: 10px;
      overflow-y: visible;
    }
    .brand {
      padding: 6px 14px;
    }
    .side a {
      padding: 10px 14px;
    }
    .grid2 {
      grid-template-columns: 1fr;
    }
    main {
      padding: 18px 14px;
      overflow-y: visible;
    }
  }

  @media print {
    .top, .side, .noprint {
      display: none !important;
    }
    body {
      display: block;
      background: #fff;
    }
    .card {
      border: 0;
    }
  }
</style>
</head>
<body>
<main>
  <div class="head">
    <div><h1>Katalog Inventaris Obat</h1><p class="sub">Master data obat, ambang batas stok, dan harga satuan.</p></div>
    <button class="btn blue" id="add" data-need="kelolaObat">+ Tambah obat</button>
  </div>
  <div id="msg" class="alert" role="alert"></div>
  <div class="card">
    <div class="tools">
      <input id="q" type="search" placeholder="Cari kode atau nama generik" aria-label="Cari obat">
      <select id="cat" aria-label="Kategori"><option value="">Semua kategori</option></select>
      <select id="flt" aria-label="Status">
        <option value="">Semua status</option><option value="aman">Aman</option><option value="menipis">Menipis</option><option value="kritis">Kritis</option><option value="nonaktif">Nonaktif</option>
      </select>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Kode</th><th>Nama obat</th><th>Kategori</th><th>Satuan</th><th class="num">Stok total</th><th class="num">Batas min</th><th class="num">Harga satuan</th><th>Status</th><th>Aksi</th></tr></thead>
      <tbody id="rows"><tr><td colspan="9" class="empty">Memuat…</td></tr></tbody>
    </table></div>
    <div class="pager"><span id="info"></span><span><button class="btn ghost" id="prev">Sebelumnya</button> <button class="btn ghost" id="next">Berikutnya</button></span></div>
  </div>
</main>

<dialog id="dlg">
  <h2>Tambah obat baru</h2>
  <div id="dmsg" class="alert" role="alert"></div>
  <form id="frm" novalidate>
    <div class="frow">
      <div class="f"><label class="lbl" for="code">Kode obat</label><input id="code" maxlength="20" required></div>
      <div class="f"><label class="lbl" for="name">Nama obat</label><input id="name" maxlength="120" required></div>
    </div>
    <div class="frow">
      <div class="f"><label class="lbl" for="cat2">Kategori terapi</label><select id="cat2" required></select></div>
      <div class="f"><label class="lbl" for="unit">Satuan</label><select id="unit" required></select></div>
    </div>
    <div class="frow">
      <div class="f"><label class="lbl" for="min">Ambang batas minimum stok</label><input id="min" type="number" min="0" step="1" required></div>
      <div class="f"><label class="lbl" for="price">Harga satuan (Rp)</label><input id="price" type="number" min="0" step="1" required></div>
    </div>
    <div class="actions"><button class="btn" id="save" type="submit">Simpan</button><button class="btn ghost" type="button" id="cancel">Batal</button></div>
  </form>
</dialog>

<script>
/* Utilitas bersama semua halaman. Sesuaikan nama peran dengan yang dipakai backend. */
const ROLE_NAMES = { admin: 'Administrator IT', gudang: 'Staf Gudang', pelayanan: 'Apoteker Pelayanan', kepala_farmasi: 'Kepala Farmasi' };
const ROLE_CAN = {
  stokMasuk: ['gudang', 'kepala_farmasi'],   // SRS 2.3: Staf Gudang & Kepala Farmasi
  kelolaObat: ['kepala_farmasi']             // master data obat: staf gudang & apoteker tidak boleh mengubah
};
const MENU = [['/dashboard','Dashboard'],['/data-obat','Data Obat'],['/stok-masuk','Stok Masuk'],['/stok-keluar','Stok Keluar'],['/monitoring','Monitoring'],['/laporan','Laporan'],['/admin','Pengguna']];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
let me = null;
const can = rule => USE_MOCK || !me || ROLE_CAN[rule].includes(me.role); // hanya kosmetik UI; otorisasi tetap di server

/* ===== DATA CONTOH (dummy) =====
   Ubah USE_MOCK ke false setelah backend siap. Login/logout/me tetap memakai backend asli.
   Reset data contoh: jalankan sessionStorage.removeItem('mockDb') di console, lalu muat ulang. */
const USE_MOCK = true;
const MOCK = (() => {
  const CATS = ['Antibiotik', 'Analgesik', 'Antihipertensi', 'Antidiabetes', 'Antasida', 'Analgesik Injeksi', 'Lainnya'];
  const lvl = x => !x.is_active ? 'nonaktif' : (x.total_stock <= 0 || x.total_stock <= x.min_stock * 0.5) ? 'kritis' : x.total_stock <= x.min_stock ? 'menipis' : 'aman';
  const seed = () => {
    const days = { 1: 12, 3: 24, 8: 18, 9: 27, 10: 29 }; // sisa hari batch terdekat (nomor urut obat)
    const meds = [
      ['Amoxicillin 500mg','Antibiotik','Kapsul',450,100,10000], ['Paracetamol 500mg','Analgesik','Tablet',1200,200,3000],
      ['Cefixime 100mg','Antibiotik','Kapsul',85,100,30000], ['Omeprazole 20mg','Antasida','Kapsul',45,50,30000],
      ['Metformin 500mg','Antidiabetes','Tablet',800,150,2000], ['Amlodipine 10mg','Antihipertensi','Tablet',650,100,3000],
      ['Ketorolac Inj 30mg','Analgesik Injeksi','Ampul',12,30,35000], ['Paracetamol Syr 60ml','Analgesik','Botol/Sirup',45,20,15000],
      ['Ranitidine Inj 25mg','Antasida','Ampul',30,20,8000], ['Ceftriaxone Inj 1g','Antibiotik','Vial',12,15,45000],
      ['Insulin Glargine','Antidiabetes','Vial',2,10,180000], ['Captopril 25mg','Antihipertensi','Tablet',500,100,1500],
      ['Ibuprofen 400mg','Analgesik','Tablet',900,200,2500], ['Ciprofloxacin 500mg','Antibiotik','Tablet',300,100,6000],
      ['Simvastatin 20mg','Lainnya','Tablet',400,100,4000], ['Salbutamol 2mg','Lainnya','Tablet',250,80,1200],
      ['Dexamethasone Inj','Lainnya','Ampul',120,40,7000], ['Antasida Doen','Antasida','Tablet',600,150,800],
      ['Glimepiride 2mg','Antidiabetes','Tablet',220,100,3500], ['Furosemide 40mg','Lainnya','Tablet',90,100,1000],
      ['Vitamin B Complex','Lainnya','Strip',150,50,5000]
    ].map((r, i) => ({ medicine_code: 'OBT-' + String(i + 1).padStart(3, '0'), name: r[0], category: r[1], unit: r[2], total_stock: r[3], min_stock: r[4], price: r[5], is_active: true, days: days[i + 1] }));
    const ref = 'RSP-' + today().replace(/-/g, '') + '-';
    const tx = [[30, ref + '089', 'Amoxicillin 500mg', 50, 'Kapsul', 'OUT'], [100, 'PO-0921-014', 'Metformin 500mg', 400, 'Tablet', 'IN'],
      [190, ref + '081', 'Ketorolac Inj 30mg', 6, 'Ampul', 'OUT'], [300, 'PO-0921-012', 'Omeprazole 20mg', 200, 'Kapsul', 'IN'],
      [1500, ref + '142', 'Paracetamol 500mg', 120, 'Tablet', 'OUT']
    ].map(([m, r, n, q, u, t]) => ({ created_at: new Date(Date.now() - m * 6e4).toISOString(), reference_number: r, medicine_name: n, quantity: q, unit: u, type: t }));
    return { meds, tx };
  };
  let DB; try { DB = JSON.parse(sessionStorage.getItem('mockDb')); } catch {}
  DB = DB || seed();
  const save = () => { try { sessionStorage.setItem('mockDb', JSON.stringify(DB)); } catch {} };

  return (url, opt = {}) => {                        // mengembalikan undefined bila endpoint tidak di-mock
    const u = new URL(url, location.origin), p = u.pathname, q = u.searchParams, m = opt.method || 'GET', b = opt.body || {}, meds = DB.meds;
    if (p === '/api/categories') return CATS.map(name => ({ name }));
    if (p === '/api/dashboard') {
      const act = meds.filter(x => x.is_active), low = act.filter(x => x.total_stock <= x.min_stock), near = act.filter(x => x.days < 30).sort((a, b) => a.days - b.days);
      const share = {}; act.forEach(x => share[x.category] = (share[x.category] || 0) + x.total_stock);
      const tot = Object.values(share).reduce((a, b) => a + b, 0) || 1, qty = [144, 180, 168, 228, 204, 252], now = new Date();
      return {
        totalMedicines: act.length, assetValue: act.reduce((s, x) => s + x.total_stock * x.price, 0), lowStock: low.length, nearExpiry: near.length,
        monthlyOut: qty.map((v, i) => ({ month: new Date(now.getFullYear(), now.getMonth() - 5 + i, 1).toLocaleDateString('id-ID', { month: 'short' }), qty: v })),
        alerts: [...near.map(x => ({ name: x.name, kind: 'expiry', level: 'red', detail: `Batch #${x.medicine_code.slice(-3)} | ${x.days} hari lagi` })),
          ...low.map(x => ({ name: x.name, kind: 'stock', level: 'yellow', detail: `Stok: ${x.total_stock} ${x.unit} | Batas Min: ${x.min_stock}` }))].slice(0, 6),
        recentTransactions: DB.tx.slice(0, 5),
        categoryShare: Object.entries(share).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([name, v]) => ({ name, percent: Math.round(v / tot * 100) }))
      };
    }
    if (p === '/api/medicines' && m === 'GET') {
      const s = (q.get('search') || '').toLowerCase(), c = q.get('category'), f = q.get('filter'), pg = +q.get('page') || 1, lim = +q.get('limit') || 20;
      const r = meds.filter(x => (!s || x.name.toLowerCase().includes(s) || x.medicine_code.toLowerCase().includes(s)) && (!c || x.category === c)
        && (q.get('active') !== '1' || x.is_active) && (!f || (f === 'expiring' ? x.is_active && x.days < 30 : f === 'low' ? ['menipis', 'kritis'].includes(lvl(x)) : lvl(x) === f)));
      return { data: r.slice((pg - 1) * lim, pg * lim), total: r.length };
    }
    if (p === '/api/medicines' && m === 'POST') {
      if (meds.some(x => x.medicine_code === b.medicine_code)) throw new Error('Kode obat sudah digunakan.');
      meds.push({ ...b, total_stock: 0, is_active: true }); save(); return {};
    }
    const st = p.match(/^\/api\/medicines\/([^/]+)\/status$/);
    if (st && m === 'PATCH') { const x = meds.find(y => y.medicine_code === decodeURIComponent(st[1])); if (x) x.is_active = !!b.is_active; save(); return {}; }
    if (p === '/api/stock/in' && m === 'POST') {
      for (const it of b.items) { const x = meds.find(y => y.medicine_code === it.medicine_code); if (!x) throw new Error('Obat tidak ditemukan: ' + it.medicine_code);
        x.total_stock += it.quantity; DB.tx.unshift({ created_at: new Date().toISOString(), reference_number: b.reference_number, medicine_name: x.name, quantity: it.quantity, unit: x.unit, type: 'IN' }); }
      save(); return { received_at: new Date().toISOString() };
    }
  };
})();

async function api(url, opt = {}) {
  if (USE_MOCK) { await new Promise(r => setTimeout(r, 200)); const d = MOCK(url, opt); if (d !== undefined) return d; }
  const r = await fetch(url, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opt, body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (r.status === 401) { location.assign('/login'); throw new Error('Sesi berakhir. Silakan masuk lagi.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.success === false) throw new Error(j.message || 'Permintaan gagal. Coba lagi.');
  return j.data;
}
function flash(el, msg, ok) { el.textContent = msg; el.className = 'alert show' + (ok ? ' ok' : ''); }

async function boot(active) {
  const page = esc(document.title.split('– ')[1] || '');
  document.body.insertAdjacentHTML('afterbegin',
    `<header class="top"><span></span><h1>Sistem Inventaris Stok Obat RS - ${page}</h1><div class="account"><small id="identity">Memuat sesi...</small><nav aria-label="Navigasi akun"><a href="/dashboard">Dashboard</a><a href="/account/password">Ganti Kata Sandi</a><button id="logout">Logout</button></nav></div></header>` +
    `<aside class="side" aria-label="Menu utama"><div class="brand">RS INVENTARIS</div>` +
    MENU.map(([h, t]) => `<a href="${h}" class="${h === active ? 'on' : ''}"${h === '/admin' ? ' id="menuAdmin" hidden' : ''}>${t}</a>`).join('') + `</aside>`);
  $('logout').onclick = async () => { $('logout').disabled = true; try { await api('/api/auth/logout', { method: 'POST', body: {} }); } catch {} location.assign('/login'); };
  try { me = (await api('/api/auth/me')).user; } catch { me = null; }   // respons: { data: { user } }
  $('identity').textContent = me ? `${me.username} | ${ROLE_NAMES[me.role] || me.role}` : '';
  $('menuAdmin').hidden = !!me && me.role !== 'admin';                // menu Pengguna hanya untuk Administrator IT
  document.querySelectorAll('[data-need]').forEach(e => { if (!can(e.dataset.need)) e.hidden = true; });
}
</script>
<script>
const LIMIT = 20, UNITS = ['Tablet','Kapsul','Botol/Sirup','Ampul','Vial','Strip','Box'];
let page = 1, pages = 1, timer;
const opts = a => a.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');

function stockStatus(m) {
  if (!m.is_active) return ['Nonaktif', 'gray'];
  const s = +m.total_stock, min = +m.min_stock;
  if (s <= 0 || s <= min * 0.5) return ['Kritis', 'red'];
  if (s <= min) return ['Menipis', 'yellow'];
  return ['Aman', 'green'];
}
async function load() {
  const q = new URLSearchParams({ page, limit: LIMIT, search: $('q').value.trim(), category: $('cat').value, filter: $('flt').value });
  try {
    const d = await api('/api/medicines?' + q);
    pages = Math.max(1, Math.ceil(d.total / LIMIT));
    $('rows').innerHTML = d.data.length ? d.data.map(m => {
      const [t, c] = stockStatus(m);
      return `<tr><td>${esc(m.medicine_code)}</td><td><strong>${esc(m.name)}</strong></td><td>${esc(m.category)}</td><td>${esc(m.unit)}</td>
        <td class="num"><strong>${Number(m.total_stock).toLocaleString('id-ID')}</strong></td><td class="num">${Number(m.min_stock).toLocaleString('id-ID')}</td>
        <td class="num">${rp(m.price)}</td><td><span class="badge ${c}">${t}</span></td>
        <td>${can('kelolaObat') ? `<button class="lnk${m.is_active ? '' : ' on'}" data-code="${esc(m.medicine_code)}" data-active="${m.is_active ? 0 : 1}">${m.is_active ? 'Nonaktifkan' : 'Aktifkan'}</button>` : ''}</td></tr>`;
    }).join('') : '<tr><td colspan="9" class="empty">Tidak ada obat yang cocok. Ubah kata kunci atau filter.</td></tr>';
    $('info').textContent = `Halaman ${page} dari ${pages} (${d.total} obat)`;
    $('prev').disabled = page <= 1; $('next').disabled = page >= pages;
  } catch (e) { flash($('msg'), e.message); }
}
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(() => { page = 1; load(); }, 300); };
$('cat').onchange = $('flt').onchange = () => { page = 1; load(); };
$('prev').onclick = () => { page--; load(); };
$('next').onclick = () => { page++; load(); };

$('rows').onclick = async e => {
  const code = e.target.dataset.code; if (!code) return;
  const on = e.target.dataset.active === '1';   // 1 = aktifkan kembali, 0 = nonaktifkan
  if (!confirm(on ? `Aktifkan kembali obat ${code}?` : `Nonaktifkan obat ${code}? Riwayat transaksinya tetap tersimpan.`)) return;
  try { await api(`/api/medicines/${encodeURIComponent(code)}/status`, { method: 'PATCH', body: { is_active: on } }); flash($('msg'), on ? 'Obat diaktifkan kembali.' : 'Obat dinonaktifkan.', true); load(); }
  catch (err) { flash($('msg'), err.message); }
};

$('add').onclick = () => { $('frm').reset(); $('dmsg').className = 'alert'; $('dlg').showModal(); };
$('cancel').onclick = () => $('dlg').close();
$('frm').onsubmit = async e => {
  e.preventDefault();
  const b = { medicine_code: $('code').value.trim().toUpperCase(), name: $('name').value.trim(), category: $('cat2').value, unit: $('unit').value, min_stock: $('min').value, price: $('price').value };
  if (!b.medicine_code || !b.name || !b.category || !b.unit) return flash($('dmsg'), 'Kode, nama, kategori, dan satuan wajib diisi.');
  if (b.min_stock === '' || +b.min_stock < 0) return flash($('dmsg'), 'Ambang batas minimum stok wajib diisi (minimal 0).');
  if (b.price === '' || +b.price < 0) return flash($('dmsg'), 'Harga satuan wajib diisi (minimal 0).');
  b.min_stock = +b.min_stock; b.price = +b.price;
  $('save').disabled = true;
  try { await api('/api/medicines', { method: 'POST', body: b }); $('dlg').close(); flash($('msg'), `Obat ${b.name} berhasil disimpan.`, true); load(); }
  catch (err) { flash($('dmsg'), err.message); }   // mis. "Kode obat sudah digunakan"
  finally { $('save').disabled = false; }
};

(async () => {
  await boot('/data-obat');
  $('unit').innerHTML = opts(UNITS);
  const f = new URLSearchParams(location.search).get('filter'); if (f) $('flt').value = f;
  const DEFAULT_CATS = ['Antibiotik', 'Analgesik', 'Antihipertensi', 'Antidiabetes', 'Antasida', 'Analgesik Injeksi']; // cadangan untuk uji tampilan
  let n;
  try { n = (await api('/api/categories')).map(x => x.name); }
  catch (e) { n = DEFAULT_CATS; flash($('msg'), 'Kategori belum bisa dimuat dari server, memakai daftar bawaan. ' + e.message); }
  $('cat').innerHTML += opts(n); $('cat2').innerHTML = '<option value="">Pilih kategori</option>' + opts(n);
  load();
  if (new URLSearchParams(location.search).get('add') && can('kelolaObat')) $('add').click();
})();
</script>
</body>
</html>
